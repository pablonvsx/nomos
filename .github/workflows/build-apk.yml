name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Check the Google keys are configured
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          for name in GOOGLE_MAPS_API_KEY GOOGLE_WEB_CLIENT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set: the APK would be built without it."
              exit 1
            fi
          done

      - name: Build APK locally
        # The template's Gradle defaults (2 GiB heap, 512 MiB metaspace) run out
        # of metaspace in the release lint tasks of this app's many modules.
        #
        # app.config.js reads these two from the environment. A local EAS build
        # does not receive EAS variables stored as "secret", so they come from
        # GitHub secrets instead; without them the APK is built with no Maps key.
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: eas build --platform android --profile preview --local --non-interactive --output ${{ github.workspace }}/nomos.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nomos-apk
          path: nomos.apk
          retention-days: 14
